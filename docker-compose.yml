services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${PILOT_DB_USER:-pilot}
      POSTGRES_PASSWORD: ${PILOT_DB_PASSWORD:-pilot_local_pw}
      POSTGRES_DB: postgres
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PILOT_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d pilot_target"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PILOT_DB_HOST: db
      PILOT_DB_PORT: 5432
      PILOT_DB_USER: ${PILOT_DB_USER:-pilot}
      PILOT_DB_PASSWORD: ${PILOT_DB_PASSWORD:-pilot_local_pw}
      PILOT_SOURCE_DB: pilot_source
      PILOT_TARGET_DB: pilot_target
    volumes:
      - ./results:/app/results
