[project]
name = "pilot_project"
version = "0.1.0"
description = "Robot Framework data validation framework (source vs target Postgres)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["unittests"]
pythonpath = ["."]
